[project]
name = "rag-system"
version = "0.1.0"
description = "Production-Grade RAG System (Updated Stable)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn>=0.46.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=25.5.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "qdrant-client>=1.17.1",
    "openai>=2.32.0",
    "anthropic>=0.97.0",
    "google-generativeai>=0.8.4",
    "cohere",
    "celery[redis]>=5.6.3",
    "httpx>=0.28.1",
    "python-multipart>=0.0.27",
    "pymupdf4llm>=1.27.2.3",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.25.0",
    "streamlit>=1.56.0",
    "boto3>=1.42.97",
    "ollama>=0.6.2",
    "langsmith>=0.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]
# uv is the canonical package manager for this project (replaces pip).
# Used both locally and inside the Docker builder stage.
# See: https://docs.astral.sh/uv/
# Python version is governed by `requires-python = ">=3.12"` above.
