services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: rag_redis_prod
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: rag_qdrant_prod
    volumes:
      - qdrant_data_prod:/qdrant/storage
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 1G

  minio:
    image: minio/minio
    container_name: rag_minio_prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_prod:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  api:
    build:
      context: ..
      target: runtime
    container_name: rag_api_prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file:
      - ../.env
    ports:
      - "80:8000"
    networks:
      - frontend
      - backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M

  worker:
    build:
      context: ..
      target: runtime
    container_name: rag_worker_prod
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file:
      - ../.env
    networks:
      - backend
    command: celery -A src.workers.celery_app worker --loglevel=info -Q ingestion --concurrency=4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data_prod:
  qdrant_data_prod:
  minio_data_prod:
  redis_data_prod:
